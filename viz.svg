<text x="56.0" y="316.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Enumerate only DIAGONAL partners of q: any stored point (x,y) with |x−qx| = |y−qy| ≠</text>
<text x="56.0" y="335.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">0. The other two corners are then FORCED: (x,qy) and (qx,y) — multiply their stored</text>
<text x="56.0" y="354.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">counts.</text>
<text x="72.0" y="389.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">query (11,10)</text>
