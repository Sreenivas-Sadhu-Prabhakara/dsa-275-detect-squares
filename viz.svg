<text x="56.0" y="475.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">1 square. Duplicate points multiply counts (hence a count map, not a set). Iterating</text>
<text x="56.0" y="494.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">diagonals — O(points) per query — beats iterating all corner triples; the</text>
<text x="56.0" y="513.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">forced-corner lookup is the collapse.</text>
